<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>연구산학팀 화요 독서노트</title>
<meta name="description" content="화요일 아침 회의에서 소개한 책 목록">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5a43'/%3E%3Cpath d='M16 18h14a4 4 0 0 1 4 4v26a3 3 0 0 0-3-3H16zM48 18H38a4 4 0 0 0-4 4v26a3 3 0 0 1 3-3h11z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f5f2; --paper:#fff; --ink:#1d2a24; --muted:#5f6d66; --line:#d8e0da;
  --accent:#1f5a43; --accent-soft:#e3eee8;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-title:"Gowun Batang","Batang",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141a17; --paper:#1c2420; --ink:#e6ece8; --muted:#9aa8a1; --line:#2f3a35;
  --accent:#7fc4a4; --accent-soft:#22362d; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--f-title);font-size:30px;margin:0;color:var(--accent);text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools input{flex:1 1 240px;min-width:0;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tools select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.year{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:6px 0 -6px}
.list{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list li{display:grid;grid-template-columns:118px 1fr;gap:14px;padding:14px 18px;border-top:1px solid var(--line);align-items:baseline}
.list li:first-child{border-top:0}
.date{font-size:13px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.title{font-family:var(--f-title);font-size:18px;font-weight:700}
.author{color:var(--muted);font-size:14px;margin-left:8px}
.link{display:inline-block;margin-top:2px;font-size:13px;color:var(--accent)}
mark{background:#fff1a8;color:inherit;border-radius:2px}
@media (prefers-color-scheme:dark){mark{background:#5a5020}}
@media (max-width:520px){.list li{grid-template-columns:1fr;gap:2px}}
.empty{padding:30px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>연구산학팀 화요 독서노트</h1>
    <p class="sub" id="sub">화요일 아침 회의에서 팀장님이 소개한 책들입니다.</p>
  </header>
  <div class="tools">
    <input id="q" type="search" placeholder="책 제목이나 저자로 찾기" aria-label="검색">
    <select id="yr" aria-label="연도"><option value="">전체 연도</option></select>
  </div>
  <div id="out"><div class="empty">책 목록을 불러오는 중…</div></div>
  <footer>삼육대학교 연구처 연구산학팀</footer>
</div>
<script>
const $ = id => document.getElementById(id);
const WD = ['일','월','화','수','목','금','토'];
const fmt = s => { const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
let books = [];

function hl(text, q) {
  const span = document.createElement('span');
  if (!q) { span.textContent = text; return span; }
  const lo = text.toLowerCase(); let i = 0, k;
  while ((k = lo.indexOf(q, i)) >= 0) {
    span.append(text.slice(i, k)); const m = document.createElement('mark'); m.textContent = text.slice(k, k + q.length); span.append(m); i = k + q.length;
  }
  span.append(text.slice(i)); return span;
}

function render() {
  const q = $('q').value.trim().toLowerCase(), yr = $('yr').value;
  const shown = books.filter(b => (!yr || b.date.startsWith(yr)) && (!q || `${b.title} ${b.author || ''}`.toLowerCase().includes(q)));
  const out = $('out'); out.replaceChildren();
  if (!shown.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = books.length ? '찾는 책이 없어요.' : '아직 등록된 책이 없어요.'; out.append(e); return; }
  let curYear = null, ul = null;
  for (const b of shown) {
    const y = b.date.slice(0, 4);
    if (y !== curYear) { curYear = y; const h = document.createElement('div'); h.className = 'year'; h.textContent = `${y}년`; out.append(h); ul = document.createElement('ul'); ul.className = 'list'; out.append(ul); }
    const li = document.createElement('li');
    const d = document.createElement('span'); d.className = 'date'; d.textContent = fmt(b.date);
    const body = document.createElement('div');
    const t = document.createElement('span'); t.className = 'title'; t.append(hl(b.title, q)); body.append(t);
    if (b.author) { const a = document.createElement('span'); a.className = 'author'; a.append(hl(b.author, q)); body.append(a); }
    if (b.link && /^https:\/\//.test(b.link)) { const l = document.createElement('a'); l.className = 'link'; l.href = b.link; l.target = '_blank'; l.rel = 'noopener'; l.textContent = '책 정보 보기 ↗'; body.append(document.createElement('br'), l); }
    li.append(d, body); ul.append(li);
  }
}

fetch('books.json', { cache: 'no-cache' }).then(r => r.json()).then(list => {
  books = list.filter(b => b && b.date && b.title).sort((a, b) => b.date.localeCompare(a.date));
  $('sub').textContent = `화요일 아침 회의에서 팀장님이 소개한 책들입니다. 지금까지 ${books.length}권.`;
  for (const y of [...new Set(books.map(b => b.date.slice(0, 4)))]) { const o = document.createElement('option'); o.value = y; o.textContent = `${y}년`; $('yr').append(o); }
  render();
}).catch(() => { $('out').innerHTML = '<div class="empty">책 목록을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</div>'; });
$('q').oninput = render; $('yr').onchange = render;
</script>
</body>
</html>
